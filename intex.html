
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogoCreate Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f2f7;color:#25243a}
header{height:65px;background:#202033;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
header h2{color:#a78bfa;margin:0}
button,select,input{font:inherit}
button{border:0;border-radius:8px;padding:10px 13px;background:#8b5cf6;color:white;cursor:pointer}
button:hover{background:#6d28d9}
button:disabled{opacity:.4;cursor:not-allowed}
.layout{display:flex;min-height:calc(100vh - 65px)}
.sidebar{width:230px;background:white;padding:16px;display:flex;flex-direction:column;gap:11px}
.sidebar h3{margin:5px 0}
.sidebar button{width:100%;text-align:left}
.sidebar label{font-size:13px;display:flex;flex-direction:column;gap:6px}
.sidebar input,.sidebar select{width:100%}
.workspace{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;align-items:center;gap:15px}
.toolbar{background:white;padding:12px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;width:100%;max-width:1000px}
.stage{width:100%;max-width:1000px;overflow:auto;background:#e1e2e9;padding:20px;border-radius:12px;display:flex;justify-content:center;align-items:flex-start}
canvas{background:white;max-width:100%;height:auto;box-shadow:0 4px 20px #0002;touch-action:none}
.hint{color:#777;font-size:13px;text-align:center}
@media(max-width:650px){
.layout{flex-direction:column}
.sidebar{width:100%;display:grid;grid-template-columns:1fr 1fr}
.sidebar h3{grid-column:1/-1}
.workspace{padding:10px}
.stage{padding:8px}
}
</style>
</head>
<body>
<header>
<h2>🎨 LogoCreate</h2>
<button onclick="downloadPNG()">⬇ Yuklab olish</button>
</header>

<div class="layout">
<aside class="sidebar">
<h3>Asboblar</h3>
<button onclick="addText()">T Matn qo'shish</button>
<button onclick="document.getElementById('upload').click()">🖼 Rasm yuklash</button>
<input type="file" id="upload" accept="image/*" hidden>
<button onclick="addShape('rect')">▢ Kvadrat</button>
<button onclick="addShape('circle')">◯ Doira</button>
<button onclick="addShape('pen')">✏️ Qalam</button>
<button onclick="deleteSelected()">🗑 O'chirish</button>
<hr>
<label>Element rangi
<input type="color" id="color" value="#000000">
</label>
<label>Matn hajmi
<input type="number" id="fontSize" value="32" min="8" max="150">
</label>
<label>Shrift
<select id="fontFamily">
<option>Arial</option>
<option>Georgia</option>
<option>Verdana</option>
<option>Times New Roman</option>
<option>Courier New</option>
</select>
</label>
<label>Fon rangi
<input type="color" id="bg" value="#ffffff">
</label>
</aside>

<main class="workspace">
<div class="toolbar">
<button onclick="undo()">↩ Undo</button>
<button onclick="redo()">↪ Redo</button>
<button onclick="clearAll()">Tozalash</button>
<button onclick="deselect()">Tanlovni bekor qilish</button>
</div>
<div class="stage">
<canvas id="canvas" width="900" height="550"></canvas>
</div>
<p class="hint">Elementni tanlash uchun bosing. Ko'chirish uchun ushlab suring. Kattalashtirish uchun burchak tutqichidan foydalaning.</p>
</main>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let objects=[];
let selected=-1;
let action=null;
let start=null;
let snapshot=null;
let history=[];
let historyIndex=-1;
let bg='#ffffff';
let penPoints=[];

function save(){
 history=history.slice(0,historyIndex+1);
 history.push(JSON.stringify({objects:objects.map(o=>{
  const copy={...o};
  delete copy.img;
  return copy;
 }),bg}));
 if(history.length>40)history.shift();
 historyIndex=history.length-1;
}

function restore(i){
 if(i<0||i>=history.length)return;
 historyIndex=i;
 const data=JSON.parse(history[i]);
 objects=data.objects.map(o=>{
  if(o.type==='image'&&o.src){
   const img=new Image();
   img.src=o.src;
   o.img=img;
   img.onload=render;
  }
  return o;
 });
 bg=data.bg;
 document.getElementById('bg').value=bg;
 selected=-1;
 render();
}
function undo(){restore(historyIndex-1)}
function redo(){restore(historyIndex+1)}

function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle=bg;
 ctx.fillRect(0,0,canvas.width,canvas.height);
 objects.forEach((o,i)=>{
  ctx.save();
  if(o.type==='text'){
   ctx.fillStyle=o.color;
   ctx.font=`${o.size}px "${o.font}"`;
   ctx.textBaseline='top';
   ctx.fillText(o.text,o.x,o.y);
  }
  if(o.type==='rect'){
   ctx.strokeStyle=o.color;ctx.lineWidth=3;
   ctx.strokeRect(o.x,o.y,o.w,o.h);
  }
  if(o.type==='circle'){
   ctx.strokeStyle=o.color;ctx.lineWidth=3;
   ctx.beginPath();
   ctx.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2),Math.abs(o.h/2),0,0,Math.PI*2);
   ctx.stroke();
  }
  if(o.type==='image'&&o.img&&o.img.complete){
   ctx.drawImage(o.img,o.x,o.y,o.w,o.h);
  }
  if(o.type==='pen'){
   ctx.strokeStyle=o.color;ctx.lineWidth=o.size;
   ctx.lineCap='round';ctx.lineJoin='round';
   ctx.beginPath();
   o.points.forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
   ctx.stroke();
  }
  ctx.restore();
  if(i===selected)drawSelection(o);
 });
}

function bounds(o){
 if(o.type==='text'){
  ctx.save();ctx.font=`${o.size}px "${o.font}"`;
  const w=ctx.measureText(o.text).width;ctx.restore();
  return{x:o.x,y:o.y,w:Math.max(w,10),h:o.size*1.25};
 }
 return{x:o.x,y:o.y,w:o.w,h:o.h};
}
function drawSelection(o){
 const b=bounds(o);
 ctx.save();ctx.strokeStyle='#3978ff';ctx.lineWidth=2;
 ctx.setLineDash([5,3]);ctx.strokeRect(b.x,b.y,b.w,b.h);
 ctx.setLineDash([]);ctx.fillStyle='white';
 ctx.strokeStyle='#3978ff';
 [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]].forEach(([x,y])=>{
  ctx.fillRect(x-5,y-5,10,10);ctx.strokeRect(x-5,y-5,10,10);
 });
 ctx.restore();
}
function addText(){
 const text=prompt('Matnni yozing:');
 if(!text)return;
 objects.push({type:'text',text,x:100,y:100,
 color:document.getElementById('color').value,
 size:Number(document.getElementById('fontSize').value),
 font:document.getElementById('fontFamily').value});
 selected=objects.length-1;save();render();
}
function addShape(type){
 const color=document.getElementById('color').value;
 if(type==='pen'){action='newpen';penPoints=[];return;}
 objects.push({type,x:120,y:120,w:150,h:100,color});
 selected=objects.length-1;save();render();
}
function deleteSelected(){
 if(selected<0)return;
 objects.splice(selected,1);selected=-1;save();render();
}
function deselect(){selected=-1;render()}
function clearAll(){
 if(!confirm('Barcha elementlar o‘chirilsinmi?'))return;
 objects=[];selected=-1;save();render();
}
function pointer(e){
 const r=canvas.getBoundingClientRect();
 return{x:(e.clientX-r.left)*canvas.width/r.width,
 y:(e.clientY-r.top)*canvas.height/r.height};
}
function hitTest(p){
 for(let i=objects.length-1;i>=0;i--){
  const b=bounds(objects[i]);
  if(p.x>=b.x-5&&p.x<=b.x+b.w+5&&p.y>=b.y-5&&p.y<=b.y+b.h+5)return i;
 }
 return -1;
}
function cornerHit(p,o){
 const b=bounds(o),s=12;
 const corners=[[b.x+b.w,b.y+b.h],[b.x,b.y+b.h],[b.x+b.w,b.y],[b.x,b.y]];
 for(const [x,y] of corners)if(Math.abs(p.x-x)<s&&Math.abs(p.y-y)<s)return true;
 return false;
}
canvas.addEventListener('pointerdown',e=>{
 const p=pointer(e);
 if(action==='newpen'){penPoints=[p];canvas.setPointerCapture(e.pointerId);return;}
 if(selected>=0&&cornerHit(p,objects[selected])){
  action='resize';start=p;snapshot=JSON.parse(JSON.stringify(objects[selected]));
  canvas.setPointerCapture(e.pointerId);return;
 }
 const hit=hitTest(p);
 if(hit>=0){
  selected=hit;action='move';start=p;
  snapshot=JSON.parse(JSON.stringify(objects[selected]));
  canvas.setPointerCapture(e.pointerId);
 }else{selected=-1;action=null;}
 render();
});
canvas.addEventListener('pointermove',e=>{
 const p=pointer(e);
 if(action==='newpen'){
  penPoints.push(p);render();
  ctx.strokeStyle=document.getElementById('color').value;
  ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();
  penPoints.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));
  ctx.stroke();return;
 }
 if(!action||selected<0)return;
 const o=objects[selected],dx=p.x-start.x,dy=p.y-start.y;
 if(action==='move'){o.x=snapshot.x+dx;o.y=snapshot.y+dy;}
 if(action==='resize'){o.w=Math.max(15,snapshot.w+dx);o.h=Math.max(15,snapshot.h+dy);}
 render();
});
function finish(e){
 if(action==='newpen'&&penPoints.length){
  objects.push({type:'pen',points:penPoints.slice(),
  color:document.getElementById('color').value,size:4});
  selected=objects.length-1;save();
 }else if(action==='move'||action==='resize')save();
 action=null;penPoints=[];render();
}
canvas.addEventListener('pointerup',finish);
canvas.addEventListener('pointercancel',finish);

document.getElementById('upload').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;
 if(!file.type.startsWith('image/')){alert('Rasm faylini tanlang');return;}
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const scale=Math.min(300/img.width,250/img.height,1);
   objects.push({type:'image',img,src:reader.result,x:100,y:100,
   w:img.width*scale,h:img.height*scale});
   selected=objects.length-1;save();render();
  };
  img.src=reader.result;
 };
 reader.readAsDataURL(file);e.target.value='';
});
document.getElementById('bg').addEventListener('input',e=>{
 bg=e.target.value;render();save();
});
function downloadPNG(){
 const old=selected;selected=-1;render();
 const a=document.createElement('a');
 a.download='LogoCreate.png';a.href=canvas.toDataURL('image/png');a.click();
 selected=old;render();
}
save();render();
</script>
</body>
</html>
